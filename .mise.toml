[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true } # required:template
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[tasks.deps]
description = "Install Helm dependencies"
run = [
  "helm plugin list | grep -q 'secrets' && helm plugin update secrets || helm plugin install https://github.com/jkroepke/helm-secrets",
  "helm plugin list | grep -q 'diff' && helm plugin update diff || helm plugin install https://github.com/databus23/helm-diff"
]

[tools]
"python" = "3.14.7" # required:template
"uv" = "0.12.17" # required:template
"pipx" = "1.17.4" # required:template
"pipx:makejinja" = "2.9.1" # required:template
"aqua:argoproj/argo-cd" = "3.5.3"
"aqua:budimanjojo/talhelper" = "3.1.17"
"aqua:cilium/cilium-cli" = "0.20.0"
"aqua:cli/cli" = "2.101.0"
"aqua:cloudflare/cloudflared" = "2026.9.1"
"aqua:cue-lang/cue" = "0.17.1" # required:template
"aqua:FiloSottile/age" = "1.3.2"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.53.1"
"aqua:helm/helm" = "4.3.0"
"aqua:helmfile/helmfile" = "1.7.4"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.8.0"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.0"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:siderolabs/talos" = "1.14.1"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:viaduct-ai/kustomize-sops" = "4.5.1"
